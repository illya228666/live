name: build-and-test

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/live-sdk
        with:
          dotnet-version: '10.0.402'
      - name: Restore dependencies
        run: dotnet restore ArtificialLife.sln
      - name: Build domain, CLI, tests and Godot C# adapter
        run: dotnet build ArtificialLife.sln -c Release --no-restore
      - name: Run clean-checkout tests
        run: |
          $env:LIVE_DOTNET = Join-Path $env:DOTNET_ROOT 'dotnet.exe'
          $full = '${{ github.event_name }}' -in @('schedule', 'workflow_dispatch')
          ./tools/test.ps1 -CleanCheckout -Fast:(!$full)
