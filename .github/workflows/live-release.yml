name: Live release
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "configs/default.json"
      - "configs/world-only.json"
      - "assets/wildlife/**"
      - "deploy/**"
      - "tools/common.ps1"
      - "tools/package*.ps1"
      - "tools/versions.json"
      - "Directory.*.props"
      - "NuGet.config"
      - "global.json"
      - ".github/workflows/live-release.yml"
  workflow_dispatch:

concurrency:
  group: live-release-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/live-sdk
        with:
          dotnet-version: '10.0.402'
      - id: build
        run: |
          node --test deploy/tests/*.test.mjs
          export LIVE_DOTNET="$DOTNET_ROOT/dotnet"
          test "$(dotnet --version)" = 10.0.402
          python3 deploy/build_release.py --output "$RUNNER_TEMP/live-release" --sequence "$GITHUB_RUN_NUMBER"
          if test -f "$RUNNER_TEMP/live-release/live-manifest.json"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - id: attest
        if: steps.build.outputs.ready == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/live-release/live-manifest.json
      - if: steps.build.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: |
          directory="$RUNNER_TEMP/live-release"
          cp "$LIVE_ATTESTATION" "$directory/live-manifest.sigstore.json"
          gh release create "live-$GITHUB_RUN_NUMBER" "$directory/"* \
            --target "$GITHUB_SHA" --title "Live $GITHUB_RUN_NUMBER" \
            --notes "World Only packages and release manifest for $GITHUB_SHA."
